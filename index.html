    ["大关/德胜路", "Daguan / Desheng Road", 30.306, 120.165, "走廊中段北侧，视具体小区位置差异较大", "North side of the mid corridor; compound-level differences can be large"],
    ["三里亭/闸弄口", "Sanliting / Zhanongkou", 30.3062, 120.194, "机场西南侧近端，低空噪声更要谨慎", "Southwest near-end area; low-altitude noise deserves caution"],
    ["濮家/艮山门北", "Pujia / north Genshan Gate", 30.314, 120.205, "靠近机场西侧进近方向", "Near the western approach side of the airfield"],
    ["笕桥/机场路", "Jianqiao / Airport Road", 30.337, 120.236, "机场近端，噪声和净空影响都强", "Near the airfield; noise and clearance constraints are both important"],

    ["丁桥南部/华丰", "South Dingqiao / Huafeng", 30.3608, 120.284, "东北延长线外侧，需实地验证", "Outside the northeastern extension; verify on site"],
    ["乔司南/临平南苑南侧", "South Qiaosi / south Linping Nanyuan", 30.39, 120.319, "东北延长线方向，影响不稳定", "Northeastern direction; exposure may be inconsistent"],
    ["海宁西/许村方向", "West Haining / Xucun direction", 30.43, 120.5, "远端延长线方向，更多是低频轰鸣/音爆不确定性", "Far-end extension; low-frequency rumble or sonic-boom uncertainty"],
    ["下沙核心区", "Core Xiasha", 30.3155, 120.35, "不在本模型中心线附近；若听到巨响，多半不能按普通航线判断", "Not near the model centerline; loud bangs may not follow ordinary route logic"],
    ["萧山钱江世纪城", "Xiaoshan Qianjiang Century City", 30.239, 120.241, "主要不属于笕桥轴线噪声带，需另看萧山机场和城市噪声", "Mostly outside this Jianqiao axis model; consider Xiaoshan Airport and urban noise separately"]
  ]
};

const state = {
  modes: {
    loose: { red: 0.55, orange: 1.10, yellow: 2.20, airportCore: 1.8, airportWatch: 4.0 },
    default: { red: 0.80, orange: 1.60, yellow: 3.00, airportCore: 2.5, airportWatch: 5.0 },
    strict: { red: 1.20, orange: 2.50, yellow: 4.00, airportCore: 3.2, airportWatch: 6.5 }
  },
  lang: preferredLang(),
  mode: "default",
  query: null,
  queryLayer: null,
  corridorLayers: [],
  restoredFromHash: false
};

const els = {
  title: document.getElementById("title"),
  subtitle: document.getElementById("subtitle"),
  leadNotice: document.getElementById("leadNotice"),
  legendTitle: document.getElementById("legendTitle"),
  legendRows: document.getElementById("legendRows"),
  modeLabel: document.getElementById("modeLabel"),
  modeSelect: document.getElementById("modeSelect"),
  fitBtn: document.getElementById("fitBtn"),
  clearBtn: document.getElementById("clearBtn"),
  searchTitle: document.getElementById("searchTitle"),
  searchBox: document.getElementById("searchBox"),
  searchBtn: document.getElementById("searchBtn"),
  searchHint: document.getElementById("searchHint"),
  searchResults: document.getElementById("searchResults"),
  result: document.getElementById("result"),
  locateBtn: document.getElementById("locateBtn"),
  shareBtn: document.getElementById("shareBtn"),
  checklistTitle: document.getElementById("checklistTitle"),
  checklist: document.getElementById("checklist"),
  placesTitle: document.getElementById("placesTitle"),
  thPlace: document.getElementById("thPlace"),
  thRisk: document.getElementById("thRisk"),
  thNote: document.getElementById("thNote"),
  methodTitle: document.getElementById("methodTitle"),
  methodText: document.getElementById("methodText"),
  privacyText: document.getElementById("privacyText"),
  sourceLinks: document.getElementById("sourceLinks"),
  offlineNotice: document.getElementById("offlineNotice"),
  langZh: document.getElementById("langZh"),
  langEn: document.getElementById("langEn")
};

const map = L.map("map", { zoomControl: true, preferCanvas: true })
  .setView([30.305, 120.215], 11);

const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);
const carto = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
});
const esriImagery = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19,
  attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community"
});
const layerControl = L.control.layers({
  "OSM 标准 / Standard": osm,
  "浅色地图 / Light": carto,
  "卫星影像 / Satellite": esriImagery
}, null, { collapsed: true }).addTo(map);
const linePts = [DATA.west, DATA.airport, DATA.east];
const placeLayer = L.layerGroup().addTo(map);
let airportMarker;
let airportLabel;

function preferredLang() {
  const stored = localStorage.getItem("jianqiao-noise-lang");
  if (stored === "zh" || stored === "en") return stored;
  return navigator.language && navigator.language.toLowerCase().startsWith("en") ? "en" : "zh";
}

function t() { return COPY[state.lang]; }
function rad(d) { return d * Math.PI / 180; }
function haversineKm(a, b) {
  const R = 6371.0088;
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const lat1 = rad(a[0]), lat2 = rad(b[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
const lat0 = DATA.airport[0], lng0 = DATA.airport[1];
function toXY(p) {
  return {
    x: (p[1] - lng0) * 111.320 * Math.cos(rad(lat0)),
    y: (p[0] - lat0) * 110.574
  };
}
function fromXY(xy) {
  return [
    xy.y / 110.574 + lat0,
    xy.x / (111.320 * Math.cos(rad(lat0))) + lng0
  ];
}
function distPointSegmentKm(p, a, b) {
  const P = toXY(p), A = toXY(a), B = toXY(b);
  const vx = B.x - A.x, vy = B.y - A.y;
  const wx = P.x - A.x, wy = P.y - A.y;
  const c2 = vx * vx + vy * vy;
  let hit = c2 ? (wx * vx + wy * vy) / c2 : 0;
  hit = Math.max(0, Math.min(1, hit));
  const Q = { x: A.x + hit * vx, y: A.y + hit * vy };
  return Math.sqrt((P.x - Q.x) ** 2 + (P.y - Q.y) ** 2);
}
function corridorPolygon(widthKm) {
  const A = toXY(DATA.west), B = toXY(DATA.east);
  const vx = B.x - A.x, vy = B.y - A.y;
  const len = Math.sqrt(vx * vx + vy * vy);
  const nx = -vy / len, ny = vx / len;
  return [
    fromXY({ x: A.x + nx * widthKm, y: A.y + ny * widthKm }),
    fromXY({ x: B.x + nx * widthKm, y: B.y + ny * widthKm }),
    fromXY({ x: B.x - nx * widthKm, y: B.y - ny * widthKm }),
    fromXY({ x: A.x - nx * widthKm, y: A.y - ny * widthKm })
  ];
}
function riskAt(p) {
  const m = state.modes[state.mode];
  const dLine = distPointSegmentKm(p, DATA.west, DATA.east);
  const dAirport = haversineKm(p, DATA.airport);
  let key = "outer";
  if (dLine <= m.red || dAirport <= m.airportCore) key = "red";
  else if (dLine <= m.orange || dAirport <= m.airportWatch) key = "orange";
  else if (dLine <= m.yellow) key = "yellow";
  const cls = key === "red" ? "risk-red" : key === "orange" ? "risk-orange" : key === "yellow" ? "risk-yellow" : "risk-green";
  return { dLine, dAirport, key, cls, level: t().risk[key][0], advice: t().risk[key][1] };
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}
function localizedPlace(pl) {
  return {
    name: state.lang === "zh" ? pl[0] : pl[1],
    lat: pl[2],
    lng: pl[3],
    note: state.lang === "zh" ? pl[4] : pl[5]
  };
}
function popupHtml(title, p, note = "") {
  const r = riskAt(p);
  const c = t();
  return `<b>${escapeHtml(title)}</b><br>
    <span class="${r.cls}">${escapeHtml(r.level)}</span><br>
    ${c.popup.line}: ${r.dLine.toFixed(2)} ${c.km}<br>
    ${c.popup.airport}: ${r.dAirport.toFixed(2)} ${c.km}<br>
    <span style="color:#475569">${escapeHtml(r.advice)}</span>
    ${note ? `<br><span style="color:#64748b">${c.popup.note}: ${escapeHtml(note)}</span>` : ""}`;
}
function markerColor(levelKey) {
  return levelKey === "red" ? "#ef4444" : levelKey === "orange" ? "#f97316" : levelKey === "yellow" ? "#eab308" : "#16a34a";
}
function makeDot(color) {
  return L.divIcon({
    className: "",
    html: `<div style="width:12px;height:12px;border-radius:999px;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>`,
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
}
function drawCorridors() {
  state.corridorLayers.forEach(layer => map.removeLayer(layer));
  state.corridorLayers = [];
  const m = state.modes[state.mode];
  const yellow = L.polygon(corridorPolygon(m.yellow), { color: "#eab308", weight: 1, fillColor: "#eab308", fillOpacity: .16, opacity: .55 }).addTo(map);
  const orange = L.polygon(corridorPolygon(m.orange), { color: "#f97316", weight: 1, fillColor: "#f97316", fillOpacity: .22, opacity: .65 }).addTo(map);
  const red = L.polygon(corridorPolygon(m.red), { color: "#ef4444", weight: 1, fillColor: "#ef4444", fillOpacity: .28, opacity: .8 }).addTo(map);
  const line = L.polyline(linePts, { color: "#334155", weight: 3, dashArray: "8,6", opacity: .9 }).bindPopup(t().axisPopup).addTo(map);
  const c1 = L.circle(DATA.airport, { radius: m.airportCore * 1000, color: "#ef4444", weight: 1, fillColor: "#ef4444", fillOpacity: .12 }).addTo(map);
  const c2 = L.circle(DATA.airport, { radius: m.airportWatch * 1000, color: "#f97316", weight: 1, fillColor: "#f97316", fillOpacity: .06, dashArray: "6,5" }).addTo(map);
  state.corridorLayers.push(yellow, orange, red, line, c1, c2);
}
function drawAirport() {
  if (airportMarker) map.removeLayer(airportMarker);
  if (airportLabel) map.removeLayer(airportLabel);
  airportMarker = L.marker(DATA.airport).addTo(map).bindPopup(t().airportPopup);
  airportLabel = L.marker(DATA.airport, {
    icon: L.divIcon({ className: "label", html: escapeHtml(t().airportName), iconSize: null })
  }).addTo(map);
}
function refreshPlaces() {
  placeLayer.clearLayers();
  const tbody = document.querySelector("#placeTable tbody");
  tbody.textContent = "";
  DATA.places.forEach(raw => {
    const pl = localizedPlace(raw);
    const p = [pl.lat, pl.lng];
    const r = riskAt(p);
    L.marker(p, { icon: makeDot(markerColor(r.key)) })
      .bindPopup(popupHtml(pl.name, p, pl.note))
      .addTo(placeLayer);
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${escapeHtml(pl.name)}</td>
      <td><span class="${r.cls}">${escapeHtml(r.level)}</span><br><span class="small">${r.dLine.toFixed(1)} ${t().km} / ${r.dAirport.toFixed(1)} ${t().km}</span></td>
      <td>${escapeHtml(pl.note)}</td>`;
    tr.onclick = () => evaluatePoint(pl.name, pl.lat, pl.lng, pl.note);
    tbody.appendChild(tr);
  });
}
function renderResult() {
  els.result.innerHTML = state.query
    ? popupHtml(state.query.name, state.query.p, state.query.note)
    : escapeHtml(t().resultDefault);
}
function updateHash() {
  const params = new URLSearchParams();
  params.set("lang", state.lang);
  params.set("mode", state.mode);
  if (state.query) {
    params.set("lat", state.query.p[0].toFixed(6));
    params.set("lng", state.query.p[1].toFixed(6));
    params.set("q", state.query.name.slice(0, 80));
    params.set("z", String(map.getZoom()));
  }
  history.replaceState(null, "", `${location.pathname}${location.search}#${params.toString()}`);
}
function evaluatePoint(name, lat, lng, note = "", opts = {}) {
  const p = [Number(lat), Number(lng)];
  if (state.queryLayer) map.removeLayer(state.queryLayer);
  state.query = { name, p, note };
  state.queryLayer = L.marker(p).addTo(map).bindPopup(popupHtml(name, p, note)).openPopup();
  if (opts.move !== false) map.setView(p, opts.zoom || 15);
  renderResult();
  if (opts.hash !== false) updateHash();
}
function clearQuery() {
  if (state.queryLayer) map.removeLayer(state.queryLayer);
  state.queryLayer = null;
  state.query = null;
  els.searchResults.textContent = "";
  renderResult();
  updateHash();
}
function renderSearchResults(items) {
  els.searchResults.textContent = "";
  if (!items.length) return;
  const label = document.createElement("p");
  label.className = "small";
  label.textContent = t().chooseResult;
  els.searchResults.appendChild(label);
  items.forEach(item => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "result-choice";
    button.innerHTML = `${escapeHtml(item.display_name || item.name)}<br><span class="small">${Number(item.lat).toFixed(5)}, ${Number(item.lon).toFixed(5)}</span>`;
    button.onclick = () => evaluatePoint(item.display_name || item.name, item.lat, item.lon);
    els.searchResults.appendChild(button);
  });
}
async function searchPlace() {
  const q = els.searchBox.value.trim();
  if (!q) return;
  els.searchResults.textContent = "";
  els.result.textContent = t().searching;
  try {
    const url = new URL("https://nominatim.openstreetmap.org/search");
    url.search = new URLSearchParams({
      format: "json",
      limit: "5",
      "accept-language": state.lang === "zh" ? "zh-CN" : "en",
      countrycodes: "cn",
      viewbox: "119.75,30.55,120.65,30.05",
      bounded: "1",
      q: `${q} ${state.lang === "zh" ? "杭州" : "Hangzhou"}`
    }).toString();
    const res = await fetch(url.toString(), { headers: { "Accept": "application/json" } });
    if (!res.ok) throw new Error(`Nominatim ${res.status}`);
    const arr = await res.json();
    if (!arr || arr.length === 0) {
      els.result.textContent = t().noResults;
      return;
    }
    renderSearchResults(arr);
    evaluatePoint(arr[0].display_name || q, Number(arr[0].lat), Number(arr[0].lon));
  } catch (err) {
    els.result.textContent = t().searchError;
  }
}
function locateUser() {
  if (!navigator.geolocation) {
    els.result.textContent = t().locateError;
    return;
  }
  els.result.textContent = t().locating;
  navigator.geolocation.getCurrentPosition(
    pos => evaluatePoint(t().currentLocation, pos.coords.latitude, pos.coords.longitude),
    () => { els.result.textContent = t().locateError; },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}
async function shareLink() {
  updateHash();
  const url = location.href || SITE_URL;
  let copied = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(url);
      copied = true;
    }
  } catch (err) {
    copied = false;
  }
  if (!copied) {
    const textarea = document.createElement("textarea");
    textarea.value = url;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.appendChild(textarea);
    textarea.select();
    try {
      copied = document.execCommand("copy");
    } catch (err) {
      copied = false;
    }
    textarea.remove();
  }
  if (copied) {
    els.shareBtn.textContent = t().copied;
    setTimeout(() => { els.shareBtn.textContent = t().share; }, 1800);
  } else {
    els.result.textContent = `${t().copyFailed} ${url}`;
  }
}
function applyLanguage() {
  const c = t();
  document.documentElement.lang = c.htmlLang;
  document.title = c.pageTitle;
  document.querySelector("meta[name='description']").setAttribute("content", c.description);
  document.querySelector("meta[property='og:title']").setAttribute("content", c.title);
  document.querySelector("meta[property='og:description']").setAttribute("content", c.description);
  els.title.textContent = c.title;
  els.subtitle.textContent = c.subtitle;
  els.leadNotice.innerHTML = c.lead;
  els.legendTitle.textContent = c.legendTitle;
  els.legendRows.innerHTML = c.legend.map(([color, label]) =>
    `<div class="legend-row"><span class="swatch" style="background:${color}"></span><span>${label}</span></div>`
  ).join("");
  els.modeLabel.textContent = c.modeLabel;
  els.modeSelect.innerHTML = Object.entries(c.modes)
    .map(([value, label]) => `<option value="${value}">${escapeHtml(label)}</option>`)
    .join("");
  els.modeSelect.value = state.mode;
  els.fitBtn.textContent = c.fit;
  els.clearBtn.textContent = c.clear;
  els.searchTitle.textContent = c.searchTitle;
  els.searchBox.placeholder = c.searchPlaceholder;
  els.searchBtn.textContent = c.searchButton;
  els.searchHint.textContent = c.searchHint;
  els.locateBtn.textContent = c.locate;
  els.shareBtn.textContent = c.share;
  els.checklistTitle.textContent = c.checklistTitle;
  els.checklist.innerHTML = c.checklist.map(item => `<li>${escapeHtml(item)}</li>`).join("");
  els.placesTitle.textContent = c.placesTitle;
  els.thPlace.textContent = c.thPlace;
  els.thRisk.textContent = c.thRisk;
  els.thNote.textContent = c.thNote;
  els.methodTitle.textContent = c.methodTitle;
  els.methodText.textContent = c.method;
  els.privacyText.textContent = c.privacy;
  els.sourceLinks.innerHTML = c.sources
    .map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`)
    .join("");
  els.offlineNotice.textContent = c.offline;
  els.langZh.setAttribute("aria-pressed", state.lang === "zh" ? "true" : "false");
  els.langEn.setAttribute("aria-pressed", state.lang === "en" ? "true" : "false");
  drawAirport();
  drawCorridors();
  refreshPlaces();
  renderResult();
}
function setLanguage(lang) {
  state.lang = lang;
  localStorage.setItem("jianqiao-noise-lang", lang);
  applyLanguage();
  if (state.queryLayer && state.query) {
    state.queryLayer.bindPopup(popupHtml(state.query.name, state.query.p, state.query.note));
  }
  updateHash();
}
function hydrateFromHash() {
  const hash = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(hash);
  const lang = params.get("lang");
  const mode = params.get("mode");
  if (lang === "zh" || lang === "en") state.lang = lang;
  if (mode && state.modes[mode]) state.mode = mode;
  const lat = Number(params.get("lat"));
  const lng = Number(params.get("lng"));
  if (params.has("lat") && params.has("lng") && Number.isFinite(lat) && Number.isFinite(lng)) {
    state.restoredFromHash = true;
    state.query = {
      name: params.get("q") || (state.lang === "zh" ? "分享的位置" : "Shared location"),
      p: [lat, lng],
      note: ""
    };
    setTimeout(() => evaluatePoint(state.query.name, lat, lng, "", {
      zoom: Number(params.get("z")) || 15,
      hash: false
    }), 0);
  }
}

els.langZh.onclick = () => setLanguage("zh");
els.langEn.onclick = () => setLanguage("en");
els.modeSelect.onchange = e => {
  state.mode = e.target.value;
  drawCorridors();
  refreshPlaces();
  if (state.query) evaluatePoint(state.query.name, state.query.p[0], state.query.p[1], state.query.note, { move: false });
  updateHash();
};
els.fitBtn.onclick = () => map.fitBounds(L.latLngBounds([DATA.west, DATA.east]).pad(.15));
els.clearBtn.onclick = clearQuery;
els.searchBtn.onclick = searchPlace;
els.searchBox.addEventListener("keydown", e => { if (e.key === "Enter") searchPlace(); });
els.locateBtn.onclick = locateUser;
els.shareBtn.onclick = shareLink;
map.on("click", e => evaluatePoint(t().clicked, e.latlng.lat, e.latlng.lng, "", { move: false }));

setTimeout(() => {
  const tiles = document.querySelectorAll(".leaflet-tile-loaded").length;
  if (tiles < 3) els.offlineNotice.style.display = "block";
}, 3500);

hydrateFromHash();
applyLanguage();
if (!state.restoredFromHash) {
  map.fitBounds(L.latLngBounds([DATA.west, DATA.east]).pad(.12));
}
</script>
